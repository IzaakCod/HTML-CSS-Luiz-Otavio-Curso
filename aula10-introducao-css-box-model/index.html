<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widht=device-widht, initial-scale=1.0">
    <title> Aula 10 Introdução ao CSS Box-Model</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .section-one {
            background-color: deeppink;
            color: #fff;
            background-image: url(https://ciclovivo.com.br/wp-content/uploads/2016/08/foto_natureza_2.jpeg);
            background-size: cover;
            background-position: center center;
            width: 200px;
            height: 50px;
            border-style: solid;
            border-width: 10px;
            border-bottom-color: firebrick;
            border-top-color: yellow;
            border-right-color: green;
            border-left-color: blue;
            /*    T    D   B    E*/
            padding: 15px 0px 15px 0px;
            /*    T    D   B    E*/
            margin: 20px 0px 0px 0px
        }

        .section-two {
            background: cyan;
            width: 200px;
            height: 50px;
            border: 5px solid black;
            padding: 15px;
            margin: 20px
        }
    </style>

</head>

<body>
    <section class="section-one">Lorem ipsum dolor sit amet consectetur adipisicing elit.</section>
    <section class="section-two">2</section>
</body>

</html>
