<!-- ============================================================
     QUADRO 12 — ATRIBUTOS DE FORMULÁRIOS
     ============================================================ -->


<!-- ============================================================
     type
     ============================================================ -->

<input type="text">

<!--
    type="text"
    = campo de texto.
-->


<input type="password">

<!--
    type="password"
    = campo para senha.
-->


<input type="email">

<!--
    type="email"
    = campo destinado a e-mail.
-->


<input type="number">

<!--
    type="number"
    = campo numérico.
-->


<input type="date">

<!--
    type="date"
    = campo de data.
-->


<input type="checkbox">

<!--
    type="checkbox"
    = caixa de seleção.
-->


<input type="radio">

<!--
    type="radio"
    = seleção de uma opção dentro de um grupo.
-->


<input type="file">

<!--
    type="file"
    = permite selecionar arquivo.
-->


<!-- ============================================================
     name
     ============================================================ -->

<input type="text" name="nome">

<!--
    name
    = identifica o campo durante o envio do formulário.
-->


<!-- ============================================================
     value
     ============================================================ -->

<input type="text" value="Izaak">

<!--
    value
    = define o valor inicial do campo.
-->


<!-- ============================================================
     placeholder
     ============================================================ -->

<input type="text" placeholder="Digite seu nome">

<!--
    placeholder
    = orientação exibida dentro do campo.
-->


<!-- ============================================================
     required
     ============================================================ -->

<input type="email" required>

<!--
    required
    = torna o preenchimento obrigatório.
-->


<!-- ============================================================
     disabled
     ============================================================ -->

<input type="text" disabled>

<!--
    disabled
    = desativa o campo.
-->


<!-- ============================================================
     readonly
     ============================================================ -->

<input type="text" value="Izaak" readonly>

<!--
    readonly
    = impede edição do valor pelo usuário.
-->


<!-- ============================================================
     checked
     ============================================================ -->

<input type="checkbox" checked>

<!--
    checked
    = deixa o checkbox selecionado inicialmente.
-->


<!-- ============================================================
     selected
     ============================================================ -->

<select>

    <option selected>
        HTML
    </option>

    <option>
        CSS
    </option>

</select>

<!--
    selected
    = deixa a opção selecionada inicialmente.
-->


<!-- ============================================================
     min
     ============================================================ -->

<input type="number" min="1">

<!--
    min="1"
    = define o valor mínimo.
-->


<!-- ============================================================
     max
     ============================================================ -->

<input type="number" max="100">

<!--
    max="100"
    = define o valor máximo.
-->


<!-- ============================================================
     step
     ============================================================ -->

<input type="number" step="0.01">

<!--
    step="0.01"
    = define o intervalo entre valores.
-->


<!-- ============================================================
     minlength
     ============================================================ -->

<input type="text" minlength="3">

<!--
    minlength="3"
    = exige pelo menos 3 caracteres.
-->


<!-- ============================================================
     maxlength
     ============================================================ -->

<input type="text" maxlength="20">

<!--
    maxlength="20"
    = permite no máximo 20 caracteres.
-->


<!-- ============================================================
     autocomplete
     ============================================================ -->

<input type="text" autocomplete="name">

<!--
    autocomplete
    = permite ao navegador sugerir/preencher
    informações conhecidas.
-->


<!-- ============================================================
     autocomplete="email"
     ============================================================ -->

<input type="email" autocomplete="email">

<!--
    Indica que o campo deve utilizar,
    quando disponível, um endereço de e-mail salvo.
-->


<!-- ============================================================
     accept
     ============================================================ -->

<input type="file" accept="image/*">

<!--
    accept="image/*"
    = indica que o campo deve aceitar arquivos
    de imagem.

    Exemplos:

    image/*
    .pdf
    .jpg,.png
    video/*
    audio/*
-->


<!-- ============================================================
     multiple
     ============================================================ -->

<input type="file" multiple>

<!--
    multiple
    = permite selecionar vários arquivos.
-->
