<!-- ============================================================
     QUADRO 13 — ATRIBUTOS DE LINKS, MÍDIA E RECURSOS
     ============================================================ -->


<!-- ============================================================
     href
     ============================================================ -->

<a href="sobre.html">
    Sobre
</a>

<!--
    href
    = define o destino de um link.
-->


<!-- ============================================================
     target
     ============================================================ -->

<a href="https://google.com" target="_blank">
    Google
</a>

<!--
    target="_blank"
    = abre em uma nova aba.
-->


<!-- ============================================================
     rel
     ============================================================ -->

<a href="https://exemplo.com" target="_blank" rel="noopener noreferrer">
    Site
</a>

<!--
    rel
    = define a relação entre o documento atual
    e o recurso de destino.
-->


<!-- ============================================================
     src
     ============================================================ -->

<img src="foto.jpg" alt="Foto">

<!--
    src
    = define a fonte/caminho do recurso.
-->


<!-- ============================================================
     alt
     ============================================================ -->

<img src="foto.jpg" alt="Pessoa utilizando computador">

<!--
    alt
    = descrição alternativa da imagem.
-->


<!-- ============================================================
     width
     ============================================================ -->

<video src="video.mp4" width="600">
</video>

<!--
    width
    = largura do elemento.
-->


<!-- ============================================================
     height
     ============================================================ -->

<iframe src="pagina.html" height="400">
</iframe>

<!--
    height
    = altura do elemento.
-->


<!-- ============================================================
     controls
     ============================================================ -->

<video src="video.mp4" controls>
</video>

<!--
    controls
    = exibe os controles de reprodução.
-->


<!-- ============================================================
     autoplay
     ============================================================ -->

<video src="video.mp4" autoplay>
</video>

<!--
    autoplay
    = solicita reprodução automática.
-->


<!-- ============================================================
     muted
     ============================================================ -->

<video src="video.mp4" autoplay muted>
</video>

<!--
    muted
    = inicia sem áudio.
-->


<!-- ============================================================
     loop
     ============================================================ -->

<video src="video.mp4" loop controls>
</video>

<!--
    loop
    = repete o conteúdo.
-->


<!-- ============================================================
     poster
     ============================================================ -->

<video src="video.mp4" poster="capa.jpg" controls>
</video>

<!--
    poster
    = imagem mostrada antes da reprodução do vídeo.
-->


<!-- ============================================================
     type
     ============================================================ -->

<source src="musica.mp3" type="audio/mpeg">

<!--
    type="audio/mpeg"
    = informa o tipo MIME do arquivo.

    Isso ajuda o navegador a identificar o recurso.
-->
