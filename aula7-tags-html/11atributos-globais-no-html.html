<!-- ============================================================
     QUADRO 11 — ATRIBUTOS GLOBAIS
     ============================================================ -->


<!-- ============================================================
     id
     ============================================================ -->

<div id="principal">
    Conteúdo
</div>

<!--
    id="principal"
    = cria um identificador para o elemento.

    O id deve ser único na página.

    Pode ser utilizado pelo:
    - CSS
    - JavaScript
    - links internos
-->


<!-- ============================================================
     class
     ============================================================ -->

<div class="container">
    Conteúdo
</div>

<!--
    class="container"
    = coloca o elemento em uma classe.

    Classes podem ser utilizadas em vários elementos.

    Muito utilizada com CSS e JavaScript.
-->


<!-- ============================================================
     VÁRIAS CLASSES
     ============================================================ -->

<div class="container destaque">
    Conteúdo
</div>

<!--
    O elemento possui duas classes:

    container
    destaque
-->


<!-- ============================================================
     title
     ============================================================ -->

<p title="Informação adicional">
    Passe o mouse aqui.
</p>

<!--
    title
    = fornece informação adicional.

    Normalmente aparece quando o mouse passa
    sobre o elemento.
-->


<!-- ============================================================
     lang
     ============================================================ -->

<p lang="en">
    Hello World
</p>

<!--
    lang="en"
    = informa que aquele conteúdo está em inglês.
-->


<!-- ============================================================
     hidden
     ============================================================ -->

<div hidden>
    Conteúdo escondido.
</div>

<!--
    hidden
    = indica que o elemento não deve ser apresentado.
-->


<!-- ============================================================
     contenteditable
     ============================================================ -->

<p contenteditable="true">
    Edite este texto.
</p>

<!--
    contenteditable="true"
    = permite editar o conteúdo diretamente no navegador.
-->


<!-- ============================================================
     dir
     ============================================================ -->

<p dir="rtl">
    Texto da direita para esquerda.
</p>

<!--
    dir="rtl"
    = direção do texto da direita para esquerda.

    rtl = right-to-left.
-->


<p dir="ltr">
    Texto da esquerda para direita.
</p>

<!--
    ltr = left-to-right.
-->


<!-- ============================================================
     spellcheck
     ============================================================ -->

<p spellcheck="true" contenteditable="true">
    Texto para verificação.
</p>

<!--
    spellcheck="true"
    = solicita verificação ortográfica.
-->


<!-- ============================================================
     style
     ============================================================ -->

<p style="color: blue;">
    Texto azul.
</p>

<!--
    style="..."
    = permite colocar CSS diretamente no elemento.

    Isso é chamado de CSS inline.

    Para projetos maiores, normalmente é melhor
    utilizar um arquivo CSS separado.
-->


<!-- ============================================================
     data-*
     ============================================================ -->

<button data-produto="123">
    Comprar
</button>

<!--
    data-*
    = permite armazenar informações personalizadas
    no elemento.

    data-produto="123"
    = cria um dado personalizado chamado "produto".
-->
