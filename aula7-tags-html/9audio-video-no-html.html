<!-- ============================================================
     QUADRO 9 — ÁUDIO E VÍDEO
     ============================================================ -->


<!-- ============================================================
     <audio>
     ============================================================ -->

<audio controls>

    <source src="musica.mp3" type="audio/mpeg">

</audio>

<!--
    <audio> = adiciona áudio à página.

    controls
    = mostra os controles de reprodução.

    <source>
    = define o arquivo utilizado.

    src
    = caminho do arquivo.

    type
    = informa o tipo do arquivo.
-->


<!-- ============================================================
     AUTOPLAY
     ============================================================ -->

<audio controls autoplay>

    <source src="musica.mp3" type="audio/mpeg">

</audio>

<!--
    autoplay
    = solicita reprodução automática.

    O navegador pode restringir autoplay,
    especialmente quando existe áudio.
-->


<!-- ============================================================
     muted
     ============================================================ -->

<audio controls autoplay muted>

    <source src="musica.mp3" type="audio/mpeg">

</audio>

<!--
    muted
    = inicia o conteúdo sem áudio.
-->


<!-- ============================================================
     loop
     ============================================================ -->

<audio controls loop>

    <source src="musica.mp3" type="audio/mpeg">

</audio>

<!--
    loop
    = faz o áudio repetir.
-->


<!-- ============================================================
     <video>
     ============================================================ -->

<video controls width="600">

    <source src="video.mp4" type="video/mp4">

</video>

<!--
    <video> = adiciona vídeo.

    controls
    = mostra os controles.

    width
    = define a largura.
-->


<!-- ============================================================
     poster
     ============================================================ -->

<video controls poster="capa.jpg">

    <source src="video.mp4" type="video/mp4">

</video>

<!--
    poster="capa.jpg"
    = imagem mostrada antes da reprodução do vídeo.
-->
