<!-- ============================================================
     QUADRO 7 — TABELAS
     ============================================================ -->


<!-- ============================================================
     <table>
     ============================================================ -->

<table>

</table>

<!--
    <table> = cria uma tabela.
-->


<!-- ============================================================
     <caption>
     ============================================================ -->

<table>

    <caption>
        Lista de alunos
    </caption>

</table>

<!--
    <caption> = título/legenda da tabela.
-->


<!-- ============================================================
     <thead>
     ============================================================ -->

<table>

    <thead>

        <tr>

            <th>Nome</th>
            <th>Idade</th>

        </tr>

    </thead>

</table>

<!--
    <thead> = cabeçalho da tabela.
-->


<!-- ============================================================
     <tbody>
     ============================================================ -->

<table>

    <tbody>

        <tr>

            <td>Izaak</td>
            <td>20</td>

        </tr>

    </tbody>

</table>

<!--
    <tbody> = corpo principal da tabela.
-->


<!-- ============================================================
     <tfoot>
     ============================================================ -->

<table>

    <tfoot>

        <tr>

            <td>Total</td>
            <td>10</td>

        </tr>

    </tfoot>

</table>

<!--
    <tfoot> = rodapé da tabela.
-->


<!-- ============================================================
     <tr>
     ============================================================ -->

<tr>

    <td>HTML</td>

    <td>Básico</td>

</tr>

<!--
    <tr> = cria uma linha da tabela.
-->


<!-- ============================================================
     <th>
     ============================================================ -->

<th>
    Nome
</th>

<!--
    <th> = cria uma célula de cabeçalho.
-->


<!-- ============================================================
     <td>
     ============================================================ -->

<td>
    Izaak
</td>

<!--
    <td> = cria uma célula de dados.
-->


<!-- ============================================================
     colspan
     ============================================================ -->

<td colspan="2">
    Informações
</td>

<!--
    colspan="2"
    = faz a célula ocupar duas colunas.
-->


<!-- ============================================================
     rowspan
     ============================================================ -->

<td rowspan="2">
    Izaak
</td>

<!--
    rowspan="2"
    = faz a célula ocupar duas linhas.
-->


<!-- ============================================================
     TABELA COMPLETA
     ============================================================ -->

<table>

    <caption>
        Alunos
    </caption>


    <thead>

        <tr>

            <th>Nome</th>
            <th>Idade</th>
            <th>Curso</th>

        </tr>

    </thead>


    <tbody>

        <tr>

            <td>Izaak</td>
            <td>20</td>
            <td>ADS</td>

        </tr>


        <tr>

            <td>João</td>
            <td>21</td>
            <td>Informática</td>

        </tr>

    </tbody>


    <tfoot>

        <tr>

            <td colspan="3">
                Total: 2 alunos
            </td>

        </tr>

    </tfoot>

</table>
