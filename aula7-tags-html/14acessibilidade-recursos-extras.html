<!-- ============================================================
     QUADRO 14 — ACESSIBILIDADE E RECURSOS EXTRAS
     ============================================================ -->

<!-- ============================================================
     aria-label
     ============================================================ -->

<button aria-label="Fechar menu">
    X
</button>

<!--
    aria-label
    = fornece uma descrição acessível para o elemento.

    É especialmente útil quando o elemento visual
    não possui um texto suficientemente descritivo.
-->

<!-- ============================================================
     aria-expanded
     ============================================================ -->

<button aria-expanded="false">
    Menu
</button>

<!--
    aria-expanded="false"
    = informa que o conteúdo controlado está fechado.

    aria-expanded="true"
    = informa que está aberto/expandido.
-->


<!-- ============================================================
     <time>
     ============================================================ -->

<time datetime="2026-09-28">
    28 de setembro de 2026
</time>

<!--
    <time>
    = representa uma data ou horário.

    datetime
    = fornece o valor em um formato que máquinas
    conseguem interpretar.
-->


<!-- ============================================================
     <address>
     ============================================================ -->

<address>

    Entre em contato:
    exemplo@email.com

</address>

<!--
    <address>
    = representa informações de contato.
-->


<!-- ============================================================
     <details>
     ============================================================ -->

<details>

    <summary>
        Ver mais
    </summary>

    <p>
        Este conteúdo pode ser expandido.
    </p>

</details>

<!--
    <details>
    = cria uma área que pode ser aberta/fechada.

    <summary>
    = título clicável da área.
-->
