<!-- ============================================================
     QUADRO 5 — LISTAS
     ============================================================ -->


<!-- ============================================================
     <ul> — LISTA NÃO ORDENADA
     ============================================================ -->

<ul>

    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>

</ul>

<!--
    <ul> = cria uma lista não ordenada.

    <li> = representa cada item da lista.

    Normalmente a lista aparece com marcadores.
-->


<!-- ============================================================
     <ol> — LISTA ORDENADA
     ============================================================ -->

<ol>

    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>

</ol>

<!--
    <ol> = cria uma lista ordenada.

    Normalmente aparece numerada.
-->


<!-- ============================================================
     start
     ============================================================ -->

<ol start="5">

    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>

</ol>

<!--
    start="5"
    = faz a lista começar pelo número 5.
-->


<!-- ============================================================
     type
     ============================================================ -->

<ol type="A">

    <li>HTML</li>
    <li>CSS</li>
    <li>JavaScript</li>

</ol>

<!--
    type="A"
    = utiliza letras maiúsculas.

    Outros exemplos:

    type="1" → números
    type="A" → letras maiúsculas
    type="a" → letras minúsculas
    type="I" → algarismos romanos maiúsculos
    type="i" → algarismos romanos minúsculos
-->


<!-- ============================================================
     <dl> — LISTA DE DESCRIÇÃO
     ============================================================ -->

<dl>

    <dt>HTML</dt>

    <dd>
        Linguagem utilizada para estruturar páginas.
    </dd>


    <dt>CSS</dt>

    <dd>
        Linguagem utilizada para estilizar páginas.
    </dd>

</dl>

<!--
    <dl> = lista de descrição.

    <dt> = termo da lista.

    <dd> = descrição do termo.
-->
