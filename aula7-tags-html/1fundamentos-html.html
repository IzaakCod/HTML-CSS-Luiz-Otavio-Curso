<!-- ============================================================
     QUADRO 1 — FUNDAMENTOS DO HTML
     ============================================================ -->


<!-- ============================================================
     <!DOCTYPE html>
     ============================================================ -->

<!DOCTYPE html>

<!--
    <!DOCTYPE html>

    Informa ao navegador que o documento utiliza HTML5.

    Não é exatamente uma tag HTML.
    É uma declaração do tipo de documento.
-->


<!-- ============================================================
     <html>
     ============================================================ -->

<html lang="pt-BR">

<!--
        <html> = elemento raiz do documento.

        Tudo que pertence à página fica dentro dele.

        lang="pt-BR"
        = informa que o idioma principal da página
        é português do Brasil.
    -->

</html>


<!-- ============================================================
     <head>
     ============================================================ -->

<head>

    <!--
        <head> = contém informações sobre a página.

        Normalmente seu conteúdo não aparece diretamente
        na área visual da página.
    -->

</head>


<!-- ============================================================
     <meta>
     ============================================================ -->

<meta charset="UTF-8">

<!--
    charset="UTF-8"

    Define a codificação dos caracteres.

    Permite utilizar corretamente:

    á
    é
    í
    ó
    ú
    ã
    õ
    ç
-->


<!-- ============================================================
     <meta name="viewport">
     ============================================================ -->

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!--
    name="viewport"
    = informa que estamos configurando a área de visualização.

    content="width=device-width"
    = faz a largura da página acompanhar a largura
    do dispositivo.

    initial-scale=1.0
    = define o nível inicial de zoom.

    Essa configuração é muito importante para páginas
    responsivas.
-->


<!-- ============================================================
     <title>
     ============================================================ -->

<title>Meu site</title>

<!--
    <title> = define o título da página.

    Ele aparece, por exemplo, na aba do navegador.
-->


<!-- ============================================================
     <body>
     ============================================================ -->

<body>

    <!--
        <body> = contém o conteúdo que será apresentado
        visualmente na página.
    -->

</body>


<!-- ============================================================
     ESTRUTURA COMPLETA
     ============================================================ -->

<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meu site</title>

</head>

<body>

    <h1>Olá, mundo!</h1>

    <p>Minha primeira página HTML.</p>

</body>

</html>
