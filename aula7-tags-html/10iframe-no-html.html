<!-- ============================================================
     QUADRO 10 — IFRAME
     ============================================================ -->


<!-- ============================================================
     <iframe>
     ============================================================ -->

<iframe src="https://www.exemplo.com" width="600" height="400" title="Página incorporada">
</iframe>

<!--
    <iframe>
    = incorpora outro conteúdo dentro da página.

    src
    = endereço do conteúdo.

    width
    = largura.

    height
    = altura.

    title
    = descrição do iframe para acessibilidade.
-->


<!-- ============================================================
     EXEMPLO COM YOUTUBE
     ============================================================ -->

<iframe width="560" height="315" src="https://www.youtube.com/embed/VIDEO" title="Vídeo do YouTube">
</iframe>

<!--
    O YouTube fornece normalmente uma URL específica
    de incorporação para ser utilizada no iframe.
-->
